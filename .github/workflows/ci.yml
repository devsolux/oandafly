name: Source integrity and supported-runtime tests
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    name: Source completeness (no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source manifest before installing anything
        run: python scripts/project_integrity.py --verify-manifest
      - name: Compile source, tests and tools
        run: python -m compileall -q src tests scripts
      - name: Unqualified source-test environment
        run: python -m pip install -e '.[dev]'
      - name: Native Linux display tools for source smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils
      - name: Packaging and desktop source tests
        run: xvfb-run -a python -m pytest -q tests/packaging tests/desktop
      - name: Actual source window smoke (not a native bundle)
        run: xvfb-run -a python scripts/verify_build.py --source --logs build/source-gui
      - name: Build and verify both distribution formats
        run: |
          python -m build
          python scripts/check_distribution.py dist/oandafly-1.0.0.tar.gz dist/oandafly-1.0.0-py3-none-any.whl
  linux:
    name: Locked supported-runtime qualification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require complete source and committed dependency locks
        run: python scripts/project_integrity.py --verify-manifest --require-locks
      - name: Verify fresh lock/export agreement
        run: |
          python -m pip install uv==0.12.17
          python scripts/lock_dependencies.py --check
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libseccomp2 gcc xvfb x11-utils
      - name: Build verified private SQLite minimum
        run: |
          python scripts/build_sqlite.py --prefix "$RUNNER_TEMP/oandafly-sqlite"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/oandafly-sqlite/lib" >> "$GITHUB_ENV"
      - name: Install reviewed hash-locked environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Actual runtime checks
        run: python -m oandafly doctor
      - name: Complete test suite without prerequisite skips
        run: |
          xvfb-run -a python scripts/check_quality.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oandafly-test-evidence
          path: build/quality/
# Neither job has broker secrets or arms trading. The locked job must remain
# blocked until genuine locks are generated/reviewed and committed with the manifest.
